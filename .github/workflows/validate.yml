name: Validate catalog

# Pull requests: the entry rules, index.json regenerated and compared, and the
# packages of the releases the change adds or edits downloaded and compared
# with their entries. Releases the change does not touch are not downloaded
# again, so a catalog of hundreds of plugins costs what a pull request
# changes.
#
# main: the same metadata checks, and no downloads — every package on main
# was verified by the pull request that added it.
#
# Weekly: the metadata checks and an availability check that asks each
# listed address whether it still answers (HEAD; nothing downloaded). That is
# not an integrity check, and it is reported as one only of availability.
# `workflow_dispatch` can download and verify named plugins on demand.
#
# Nothing here extracts or runs a package. The token is read-only and a pull
# request from a fork gets no secrets.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      ids:
        description: "Plugin ids to download and verify (space separated; empty: none)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validator tests
        run: python3 -m unittest discover -s tests -v

      - name: Every entry follows the rules
        run: python3 tools/catalog.py validate

      - name: index.json is generated from plugins/
        run: python3 tools/catalog.py build --check

      - name: The releases this change adds or edits match their packages
        if: github.event_name == 'pull_request'
        run: python3 tools/catalog.py verify --changed "origin/${{ github.base_ref }}"

      - name: Listed addresses still answer (availability only)
        if: github.event_name == 'schedule'
        run: python3 tools/catalog.py availability

      - name: Verify the plugins named by hand
        if: github.event_name == 'workflow_dispatch' && inputs.ids != ''
        env:
          IDS: ${{ inputs.ids }}
        run: |
          set -f
          python3 tools/catalog.py verify $IDS
