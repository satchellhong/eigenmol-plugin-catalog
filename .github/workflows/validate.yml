name: Validate catalog

# Runs on every pull request and on main. Reads entries and downloads the
# packages a change lists; it never extracts or runs a package. The token is
# read-only and a pull request from a fork gets no secrets.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: a listed download that has disappeared or changed is found here
    # rather than by a user.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validator tests
        run: python3 -m unittest discover -s tests -v

      - name: Every entry follows the rules
        run: python3 tools/catalog.py validate

      - name: index.json is generated from plugins/
        run: python3 tools/catalog.py build --check

      - name: The packages this change lists match their entries
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -f
          ids=$(git diff --name-only --diff-filter=AM "origin/${BASE}...HEAD" -- 'plugins/*.json' \
            | sed -n 's#^plugins/\(.*\)\.json$#\1#p')
          if [ -n "$ids" ]; then
            python3 tools/catalog.py verify $ids
          else
            echo "No entry was added or changed."
          fi

      - name: Every listed package matches its entry
        if: github.event_name != 'pull_request'
        run: python3 tools/catalog.py verify
